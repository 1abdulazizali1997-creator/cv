<style>
/* Layout: one-column mobile wizard — deep-green header band with progress, one step per screen, sticky action bar */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --ink:#13261F; --muted:#56695F; --line:#D6E0DA;
  --brand:#0E2A22; --on-brand:#F4F1EA; --on-brand-muted:#B7C8C0; --gold:#D4AF6A; --gold-ink:#7A5A1E;
  --field:#FBFCFB; --chip-on:#0E2A22; --chip-on-ink:#FFFFFF; --tip:#FBF5E8; --tip-line:#E9D7AE;
  --danger:#B42318; --wa:#1F7A4D;
  --display:'Tajawal', 'IBM Plex Sans Arabic', system-ui, sans-serif;
  --body:'IBM Plex Sans Arabic', 'Tajawal', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A1C16; --surface:#11291F; --ink:#E8EFEB; --muted:#A3B6AD; --line:#244238;
  --brand:#061410; --on-brand:#F4F1EA; --on-brand-muted:#9FB3AA; --gold:#D4AF6A; --gold-ink:#E3C68D;
  --field:#0D231B; --chip-on:#D4AF6A; --chip-on-ink:#0E2A22; --tip:#1C2A1C; --tip-line:#4A4428;
  --danger:#F97066; --wa:#2E9E66; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0A1C16; --surface:#11291F; --ink:#E8EFEB; --muted:#A3B6AD; --line:#244238;
  --brand:#061410; --on-brand:#F4F1EA; --on-brand-muted:#9FB3AA; --gold:#D4AF6A; --gold-ink:#E3C68D;
  --field:#0D231B; --chip-on:#D4AF6A; --chip-on-ink:#0E2A22; --tip:#1C2A1C; --tip-line:#4A4428;
  --danger:#F97066; --wa:#2E9E66; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{background:var(--brand);color:var(--on-brand);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header .wrap{padding-block:18px 16px;display:flex;flex-direction:column;gap:12px}
.brandrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brandrow b{font-family:var(--display);font-weight:800;font-size:17px}
.badge{font-family:var(--display);font-weight:800;font-size:13px;background:var(--gold);color:#0E2A22;padding:4px 10px;border-radius:999px;direction:ltr}
.steprow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.steprow h1{margin:0;font-family:var(--display);font-weight:800;font-size:24px;line-height:1.3;text-wrap:balance}
.steprow span{font-size:13px;color:var(--on-brand-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{height:5px;background:rgba(255,255,255,.14);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease}

main .wrap{padding-block:22px 120px}
.step{display:flex;flex-direction:column;gap:18px}
.lead{margin:0;color:var(--muted);font-size:15px}
.tip{background:var(--tip);border:1px solid var(--tip-line);border-radius:12px;padding:12px 14px;font-size:14.5px;color:var(--ink)}
.tip strong{font-family:var(--display);font-weight:800}

.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-weight:600;font-size:15px}
.req{color:var(--danger);margin-inline-start:2px}
.opt{color:var(--muted);font-weight:400;font-size:13px}
.hint{font-size:13px;color:var(--muted);margin:0}
input[type=text],input[type=email],input[type=tel],textarea{
  width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--field);
  border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .15s}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--muted) 75%,transparent)}
.ltr{direction:ltr;text-align:right}
.err{border-color:var(--danger)!important}
.errmsg{color:var(--danger);font-size:13px;margin:0}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;font-weight:500;min-height:44px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.chip:focus-visible,.btn:focus-visible,.linkbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.job{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.jobhead{display:flex;justify-content:space-between;align-items:center}
.jobhead b{font-family:var(--display);font-weight:800;font-size:17px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:420px){.row2{grid-template-columns:minmax(0,1fr)}}
.check{display:flex;align-items:center;gap:8px;font-size:14.5px;min-height:32px}
.check input{width:20px;height:20px;accent-color:var(--brand)}
.linkbtn{font:inherit;font-size:14px;color:var(--danger);background:none;border:0;cursor:pointer;padding:8px;min-height:44px}
.addjob{font:inherit;font-weight:600;min-height:52px;border:1.5px dashed var(--muted);border-radius:14px;background:transparent;color:var(--ink);cursor:pointer}

.preview{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px;white-space:pre-wrap;font-size:14.5px;line-height:1.75;max-height:52vh;overflow:auto;overflow-wrap:anywhere}
.files{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}
.sendrow{display:flex;flex-direction:column;gap:10px}
.btn{font-family:var(--display);font-weight:800;font-size:17px;min-height:52px;border-radius:14px;border:0;padding:12px 18px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
.btn.primary{background:var(--brand);color:var(--on-brand)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.wa{background:var(--wa);color:#FFFFFF}
.btn[disabled]{opacity:.4;cursor:default}
.contact{text-align:center;color:var(--muted);font-size:14px}
.contact b{direction:ltr;display:inline-block;color:var(--ink);font-variant-numeric:tabular-nums}

.actions{position:fixed;inset:auto 0 0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.actions .wrap{padding-block:12px;display:flex;gap:10px}
.actions .primary{flex:1}
.actions .ghost{flex:0 0 auto;min-width:96px}
.hero{background:var(--brand);color:var(--on-brand);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:10px}
.hero h2{margin:0;font-family:var(--display);font-weight:800;font-size:26px;line-height:1.35;text-wrap:balance}
.hero p{margin:0;color:var(--on-brand-muted);font-size:15.5px}
.perks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.perks li{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.perks b{font-family:var(--display);font-weight:800;font-size:16px}
.perks span{color:var(--muted);font-size:14px}
.saved{font-size:12px;color:var(--muted);text-align:center;padding-bottom:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<header>
  <div class="wrap">
    <div class="brandrow"><b>سيرة ذاتية احترافية</b><span class="badge">ATS ✓</span></div>
    <div class="steprow"><h1 id="stepTitle">بياناتك الأساسية</h1><span id="stepCount">1 من 7</span></div>
    <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
  </div>
</header>

<main><div class="wrap"><form id="form" novalidate></form></div></main>

<div class="actions"><div class="wrap">
  <button type="button" class="btn ghost" id="backBtn">رجوع</button>
  <button type="button" class="btn primary" id="nextBtn">التالي</button>
</div><div class="saved" id="savedNote">إجاباتك تنحفظ تلقائياً في جوالك</div></div>

<script>
const WA_NUMBER = '966566526253';
const STEPS = [
  { title:'بياناتك الأساسية', lead:'نبدأ بالمعلومات اللي تظهر في رأس السيرة.', fields:[
    {id:'nameAr',label:'الاسم الكامل بالعربي',type:'text',req:true,ph:'مثال: محمد عبدالله السالم'},
    {id:'nameEn',label:'الاسم بالإنجليزي',type:'text',ltr:true,ph:'As in passport',hint:'كما هو مكتوب في الجواز'},
    {id:'phone',label:'رقم الجوال',type:'tel',req:true,ltr:true,ph:'05XXXXXXXX'},
    {id:'email',label:'البريد الإلكتروني',type:'email',ltr:true,ph:'name@gmail.com',hint:'يفضّل يكون باسمك، بدون ألقاب أو أرقام عشوائية'},
    {id:'city',label:'المدينة والحي',type:'text',ph:'مثال: الرياض – حي النرجس'},
    {id:'linkedin',label:'رابط LinkedIn',type:'text',ltr:true,opt:true,ph:'linkedin.com/in/...'}
  ]},
  { title:'الوظيفة المستهدفة', lead:'كل ما كان هدفك أوضح، صارت السيرة أدق في الوصول له.', fields:[
    {id:'target',label:'المسمى الوظيفي اللي تستهدفه',type:'text',req:true,ph:'مثال: محاسب، أخصائي موارد بشرية، فني مختبر'},
    {id:'sectors',label:'الجهات اللي تبي تتقدم لها',type:'multi',options:['قطاع حكومي','شركات كبرى','قطاع صحي','قطاع خاص','قطاع تعليمي','بنوك ومالية','أي جهة مناسبة']},
    {id:'jobAd',label:'إعلان وظيفة تستهدفها',type:'textarea',opt:true,ph:'الصق رابط الإعلان أو نصه',hint:'نستخرج منه الكلمات المفتاحية اللي تبحث عنها أنظمة ATS'},
    {id:'why',label:'في جملتين: ليش يوظفونك أنت بالذات؟',type:'textarea',ph:'مثال: عندي خبرة 4 سنوات في خدمة العملاء، وسريع التعلم على الأنظمة الجديدة'}
  ]},
  { title:'التعليم', lead:'اكتب آخر مؤهل حصلت عليه.', fields:[
    {id:'degree',label:'المؤهل',type:'single',options:['ثانوي','دبلوم','بكالوريوس','ماجستير','دكتوراه']},
    {id:'major',label:'التخصص',type:'text',ph:'مثال: إدارة أعمال'},
    {id:'school',label:'الجامعة / المعهد',type:'text',ph:'مثال: جامعة الملك سعود'},
    {id:'grad',label:'سنة التخرج',type:'text',ltr:true,ph:'2022'},
    {id:'gpa',label:'المعدل',type:'text',opt:true,ph:'مثال: 4.2 من 5'},
    {id:'honors',label:'مرتبة شرف أو جوائز دراسية',type:'text',opt:true},
    {id:'coop',label:'التدريب التعاوني أو الميداني',type:'textarea',opt:true,ph:'أين تدربت، كم المدة، وماذا عملت؟'}
  ]},
  { title:'الخبرات العملية', lead:'ابدأ بالوظيفة الحالية أو الأحدث.', fields:[
    {id:'hasExp',label:'هل عندك خبرة عملية؟',type:'single',options:['نعم، عندي خبرة','حديث تخرج / بدون خبرة']},
    {id:'jobs',type:'jobs'}
  ]},
  { title:'إنجازاتك', lead:'هذا أهم قسم في السيرة، وهو اللي يفرّقك عن باقي المتقدمين.', tip:'<strong>سر السيرة القوية: الأرقام.</strong> "أخدم أكثر من 60 مراجع يومياً" أقوى بكثير من "خدمة المراجعين". اكتب الرقم ولو كان تقريبي.', fields:[
    {id:'impact',label:'أبرز شيء سويته وكان له أثر واضح',type:'textarea',ph:'مثال: نظّمت أرشيف القسم إلكترونياً، فصار البحث عن أي ملف يأخذ دقيقة بدل ساعة'},
    {id:'numbers',label:'أرقام تعبّر عن شغلك',type:'textarea',ph:'مثال: أنجز 40 معاملة يومياً، حققت 110% من هدف المبيعات، دربت 5 موظفين جدد'},
    {id:'awards',label:'شهادات شكر أو تكريم',type:'textarea',opt:true,ph:'مثال: الموظف المثالي لعام 2024'},
    {id:'initiatives',label:'مشاريع أو لجان أو مبادرات شاركت فيها',type:'textarea',opt:true}
  ]},
  { title:'المهارات والدورات', lead:'هنا تظهر الكلمات المفتاحية اللي تبحث عنها أنظمة الفرز.', fields:[
    {id:'tech',label:'مهاراتك في مجالك',type:'textarea',ph:'مثال: إعداد القوائم المالية، المطابقات البنكية، إدارة المستودعات'},
    {id:'software',label:'البرامج والأنظمة اللي تتقنها',type:'textarea',ph:'مثال: Excel متقدم، SAP، أنظمة المستشفيات'},
    {id:'soft',label:'مهاراتك الشخصية',type:'multi',max:5,hint:'اختر حتى 5',options:['القيادة','التواصل الفعّال','حل المشكلات','العمل تحت الضغط','العمل الجماعي','إدارة الوقت','التفكير التحليلي','خدمة العملاء','التفاوض','سرعة التعلم']},
    {id:'courses',label:'الدورات',type:'textarea',opt:true,ph:'لكل دورة: الاسم – الجهة – السنة'},
    {id:'certs',label:'شهادات احترافية أو تصنيف مهني',type:'text',opt:true,ph:'مثال: CMA، PMP، تصنيف الهيئة السعودية للتخصصات الصحية'},
    {id:'english',label:'مستواك في الإنجليزي',type:'single',options:['مبتدئ','متوسط','جيد جداً','طلاقة']},
    {id:'langTest',label:'اختبار لغة والدرجة',type:'text',opt:true,ph:'مثال: IELTS 6.5 أو STEP 85'},
    {id:'volunteer',label:'أعمال تطوعية',type:'textarea',opt:true,ph:'أين، كم ساعة، وماذا كان دورك؟'}
  ]},
  { title:'شكل سيرتك', lead:'آخر خطوة، بعدها تراجع إجاباتك وترسلها.', fields:[
    {id:'cvLang',label:'لغة السيرة',type:'single',req:true,options:['عربي','إنجليزي','عربي + إنجليزي']},
    {id:'photo',label:'صورة شخصية في السيرة؟',type:'single',options:['نعم','لا']},
    {id:'style',label:'الستايل',type:'single',options:['رسمي كلاسيكي','عصري','أترك الاختيار لكم']},
    {id:'qr',label:'رمز QR في السيرة',type:'single',options:['يوصل لجوالي','يوصل لحسابي في LinkedIn','بدون QR']},
    {id:'avail',label:'متى تقدر تباشر العمل؟',type:'single',options:['فوراً','خلال أسبوعين','خلال شهر']},
    {id:'relocate',label:'مستعد للعمل في مدينة أخرى؟',type:'single',options:['نعم','لا','حسب العرض']},
    {id:'notes',label:'ملاحظات أو طلبات إضافية',type:'textarea',opt:true}
  ]}
];
const LABELS = {}; STEPS.forEach(s=>s.fields.forEach(f=>{ if(f.label) LABELS[f.id]=f.label; }));

const KEY='cv-intake-draft-v1';
let state = { cur:-1, v:{}, jobs:[newJob()] };
try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&s.v){ state=Object.assign(state,s); if(!state.jobs||!state.jobs.length) state.jobs=[newJob()]; } }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function newJob(){ return {title:'',org:'',from:'',to:'',now:false,tasks:'',tools:''}; }
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const form = document.getElementById('form');

function fieldHTML(f){
  if(f.type==='jobs') return `<div id="jobsBox" style="display:flex;flex-direction:column;gap:14px"></div>`;
  const mark = f.req?'<span class="req" aria-hidden="true">*</span>':(f.opt?' <span class="opt">(اختياري)</span>':'');
  const hint = f.hint?`<p class="hint" id="${f.id}-hint">${esc(f.hint)}</p>`:'';
  const err = `<p class="errmsg" id="${f.id}-err" hidden>هذا الحقل مطلوب</p>`;
  if(f.type==='single'||f.type==='multi'){
    const chips = f.options.map(o=>`<button type="button" class="chip" data-f="${f.id}" data-o="${esc(o)}" aria-pressed="false">${esc(o)}</button>`).join('');
    return `<div class="field" role="group" aria-labelledby="${f.id}-l"><span class="lbl" id="${f.id}-l">${esc(f.label)}${mark}</span>${hint}<div class="chips">${chips}</div>${err}</div>`;
  }
  const common = `id="${f.id}" name="${f.id}" data-v="${f.id}" placeholder="${esc(f.ph||'')}" ${f.ltr?'class="ltr" dir="ltr"':''} ${f.hint?`aria-describedby="${f.id}-hint"`:''}`;
  const ctl = f.type==='textarea' ? `<textarea ${common}></textarea>` :
    `<input type="${f.type}" ${common} ${f.type==='tel'?'inputmode="tel"':''} ${f.type==='email'?'autocomplete="email"':''}>`;
  return `<div class="field"><label for="${f.id}">${esc(f.label)}${mark}</label>${hint}${ctl}${err}</div>`;
}

const INTRO = `<section class="step" data-step="-1" hidden>
  <div class="hero">
    <h2>خلّ سيرتك الذاتية تفتح لك أبواب الوظيفة</h2>
    <p>نجهز لك سيرة ذاتية احترافية متوافقة مع أنظمة التوظيف ATS. نحتاج منك بس تجاوب على أسئلة سريعة عن تعليمك وخبراتك ومهاراتك.</p>
  </div>
  <ul class="perks">
    <li><b>7 خطوات قصيرة</b><span>تقريباً 7 دقائق، وأغلبها اختيارات تضغط عليها</span></li>
    <li><b>إجاباتك محفوظة</b><span>لو طلعت من الصفحة ترجع تكمل من مكانك</span></li>
    <li><b>إرسال بضغطة زر</b><span>في النهاية توصلنا إجاباتك مرتبة على الواتساب</span></li>
  </ul>
  <div class="tip"><strong>جهّز معك:</strong> تواريخ وظائفك، وأسماء دوراتك وشهاداتك. وإذا عندك إعلان وظيفة تستهدفها، خلّه قريب منك.</div>
  <button type="button" class="btn primary" id="startBtn">ابدأ الآن</button>
  <p class="contact">للاستفسار، واتساب فقط: <b>0566526253</b></p>
</section>`;
form.innerHTML = INTRO + STEPS.map((s,i)=>`<section class="step" data-step="${i}" hidden>
  <p class="lead">${esc(s.lead)}</p>${s.tip?`<div class="tip">${s.tip}</div>`:''}
  ${s.fields.map(fieldHTML).join('')}</section>`).join('') +
  `<section class="step" data-step="7" hidden>
    <p class="lead">هذي إجاباتك كما بتوصلنا. راجعها، وإذا فيه شيء تبي تعدله اضغط "رجوع".</p>
    <div class="preview" id="preview" tabindex="0" aria-label="ملخص إجاباتك"></div>
    <div class="tip"><strong>بعد الإرسال:</strong> أرفق في نفس المحادثة:
      <ul class="files" id="filesList"></ul></div>
    <div class="sendrow">
      <a class="btn wa" id="waLink" href="#" target="_blank" rel="noopener">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 20.5l1.3-4A8.5 8.5 0 1 1 8 19.6z"/><path d="M9 8.6c.2 2.9 2.6 5.3 5.5 5.6l1-1.3-1.6-.9-.8.6a4 4 0 0 1-2.1-2.1l.6-.8-.9-1.6z"/></svg>
        أرسل الإجابات عبر واتساب</a>
      <div class="tip" id="afterSend" hidden><strong>آخر خطوة:</strong> انفتحت لك محادثة الواتساب والرسالة مكتوبة فيها. اضغط زر الإرسال هناك، وبعدها أرفق ملفاتك. شكراً لك 🌿</div>
      <button type="button" class="btn ghost" id="copyBtn">نسخ الإجابات</button>
      <p class="hint" id="copyNote" hidden></p>
      <p class="contact">إذا ما فتح الواتساب، انسخ الإجابات وأرسلها على الرقم <b>0566526253</b></p>
    </div>
  </section>`;

// restore values
form.querySelectorAll('[data-v]').forEach(el=>{ el.value = state.v[el.dataset.v] || ''; });
function paintChips(){
  form.querySelectorAll('.chip').forEach(c=>{
    const val = state.v[c.dataset.f];
    const on = Array.isArray(val) ? val.includes(c.dataset.o) : val===c.dataset.o;
    c.setAttribute('aria-pressed', on?'true':'false');
  });
}
paintChips();

form.addEventListener('input', e=>{
  const el=e.target;
  if(el.dataset.v){ state.v[el.dataset.v]=el.value; el.classList.remove('err'); const m=document.getElementById(el.dataset.v+'-err'); if(m) m.hidden=true; save(); }
  if(el.dataset.j){ const [i,k]=el.dataset.j.split(':'); state.jobs[+i][k]= el.type==='checkbox'?el.checked:el.value;
    if(k==='now'){ const to=document.getElementById(`job${i}-to`); to.disabled=el.checked; if(el.checked){to.value='';state.jobs[+i].to='';} }
    save(); }
});
form.addEventListener('click', e=>{
  const c=e.target.closest('.chip');
  if(c){
    const f=c.dataset.f, o=c.dataset.o, def=findField(f);
    if(def.type==='multi'){
      let arr=Array.isArray(state.v[f])?state.v[f].slice():[];
      if(arr.includes(o)) arr=arr.filter(x=>x!==o); else { if(def.max && arr.length>=def.max) return; arr.push(o); }
      state.v[f]=arr;
    } else state.v[f] = state.v[f]===o ? '' : o;
    const m=document.getElementById(f+'-err'); if(m) m.hidden=true;
    paintChips(); if(f==='hasExp') renderJobs(); save(); return;
  }
  const rm=e.target.closest('[data-rm]');
  if(rm){ state.jobs.splice(+rm.dataset.rm,1); if(!state.jobs.length) state.jobs.push(newJob()); renderJobs(); save(); return; }
  if(e.target.closest('#addJob')){ state.jobs.push(newJob()); renderJobs(); save();
    const n=state.jobs.length-1; document.getElementById(`job${n}-title`)?.focus(); }
});
function findField(id){ for(const s of STEPS) for(const f of s.fields) if(f.id===id) return f; }

function renderJobs(){
  const box=document.getElementById('jobsBox');
  if(state.v.hasExp==='حديث تخرج / بدون خبرة'){ box.innerHTML='<div class="tip">ولا يهمك، نركّز في سيرتك على التعليم والتدريب والمهارات والدورات. اضغط "التالي".</div>'; return; }
  box.innerHTML = state.jobs.map((j,i)=>`<div class="job">
    <div class="jobhead"><b>${i===0?'الوظيفة الحالية / الأحدث':'وظيفة سابقة '+i}</b>${state.jobs.length>1?`<button type="button" class="linkbtn" data-rm="${i}">حذف</button>`:''}</div>
    <div class="field"><label for="job${i}-title">المسمى الوظيفي</label><input type="text" id="job${i}-title" data-j="${i}:title" value="${esc(j.title)}" placeholder="مثال: موظف استقبال"></div>
    <div class="field"><label for="job${i}-org">الجهة والمدينة</label><input type="text" id="job${i}-org" data-j="${i}:org" value="${esc(j.org)}" placeholder="مثال: مستشفى الولادة والأطفال – الخرج"></div>
    <div class="row2">
      <div class="field"><label for="job${i}-from">من (شهر/سنة)</label><input type="text" id="job${i}-from" data-j="${i}:from" value="${esc(j.from)}" class="ltr" dir="ltr" placeholder="03/2021"></div>
      <div class="field"><label for="job${i}-to">إلى (شهر/سنة)</label><input type="text" id="job${i}-to" data-j="${i}:to" value="${esc(j.to)}" class="ltr" dir="ltr" placeholder="08/2024" ${j.now?'disabled':''}></div>
    </div>
    <label class="check"><input type="checkbox" id="job${i}-now" data-j="${i}:now" ${j.now?'checked':''}> ما زلت على رأس العمل</label>
    <div class="field"><label for="job${i}-tasks">مهامك الأساسية</label><p class="hint">اكتب كل مهمة في سطر، 5 مهام على الأقل</p><textarea id="job${i}-tasks" data-j="${i}:tasks" placeholder="استقبال المراجعين وتوجيههم&#10;حجز المواعيد في النظام&#10;...">${esc(j.tasks)}</textarea></div>
    <div class="field"><label for="job${i}-tools">البرامج والأنظمة اللي استخدمتها <span class="opt">(اختياري)</span></label><input type="text" id="job${i}-tools" data-j="${i}:tools" value="${esc(j.tools)}" placeholder="مثال: نظام موعد، Excel"></div>
  </div>`).join('') + (state.jobs.length<5?'<button type="button" class="addjob" id="addJob">+ إضافة وظيفة سابقة</button>':'');
}
renderJobs();

// ===== message =====
function buildMessage(){
  const v=state.v, out=['*طلب سيرة ذاتية احترافية (ATS)*'];
  const val=id=>{ const x=v[id]; return Array.isArray(x)?x.join('، '):(x||'').trim(); };
  const sec=(title,ids)=>{ const rows=ids.map(id=>[LABELS[id],val(id)]).filter(r=>r[1]);
    if(rows.length){ out.push('', `*▪️ ${title}*`); rows.forEach(([l,x])=>out.push(x.includes('\n')?`• ${l}:\n${x}`:`• ${l}: ${x}`)); } };
  sec('البيانات الأساسية',['nameAr','nameEn','phone','email','city','linkedin']);
  sec('الوظيفة المستهدفة',['target','sectors','jobAd','why']);
  sec('التعليم',['degree','major','school','grad','gpa','honors','coop']);
  if(v.hasExp==='حديث تخرج / بدون خبرة'){ out.push('','*▪️ الخبرات العملية*','• حديث تخرج / بدون خبرة'); }
  else {
    const jobs=state.jobs.filter(j=>j.title||j.org||j.tasks);
    if(jobs.length){ out.push('','*▪️ الخبرات العملية*');
      jobs.forEach((j,i)=>{ out.push(`*${i+1}) ${j.title||'—'}*${j.org?' | '+j.org:''}`);
        const per=[j.from,j.now?'حتى الآن':j.to].filter(Boolean).join(' – '); if(per) out.push('• المدة: '+per);
        if(j.tasks.trim()) out.push('• المهام:\n'+j.tasks.trim().split('\n').filter(Boolean).map(t=>'  - '+t.trim()).join('\n'));
        if(j.tools.trim()) out.push('• الأنظمة: '+j.tools.trim()); }); }
  }
  sec('الإنجازات',['impact','numbers','awards','initiatives']);
  sec('المهارات والدورات',['tech','software','soft','courses','certs','english','langTest','volunteer']);
  sec('شكل السيرة',['cvLang','photo','style','qr','avail','relocate','notes']);
  return out.join('\n');
}

// ===== navigation =====
const titleEl=document.getElementById('stepTitle'), countEl=document.getElementById('stepCount'), barEl=document.getElementById('barFill');
const nextBtn=document.getElementById('nextBtn'), backBtn=document.getElementById('backBtn');
function show(i){
  state.cur=i; save();
  form.querySelectorAll('.step').forEach(s=>s.hidden = +s.dataset.step!==i);
  const review = i===7, intro = i===-1;
  document.querySelector('.actions').hidden = intro;
  titleEl.textContent = intro ? 'أهلاً بك 👋' : review ? 'راجع وأرسل' : STEPS[i].title;
  countEl.textContent = intro ? '' : review ? 'المراجعة' : `${i+1} من 7`;
  barEl.style.width = (intro?0:review?100:(i+1)/8*100)+'%';
  backBtn.disabled = false;
  nextBtn.hidden = review;
  nextBtn.textContent = i===6 ? 'راجع إجاباتك' : 'التالي';
  if(review){
    const msg=buildMessage();
    document.getElementById('preview').textContent=msg;
    document.getElementById('waLink').href=`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`;
    const files=['سيرتك القديمة (إن وجدت)','صور الشهادات والدورات'];
    if(state.v.photo==='نعم') files.push('صورة شخصية رسمية بخلفية سادة');
    document.getElementById('filesList').innerHTML=files.map(f=>`<li>${esc(f)}</li>`).join('');
  }
  window.scrollTo({top:0,behavior:'instant'});
}
function validate(i){
  let ok=true, first=null;
  STEPS[i].fields.filter(f=>f.req).forEach(f=>{
    const x=state.v[f.id]; const empty = Array.isArray(x)?!x.length:!(x||'').trim();
    const m=document.getElementById(f.id+'-err'), el=document.getElementById(f.id);
    if(empty){ ok=false; if(m) m.hidden=false; if(el){ el.classList.add('err'); first=first||el; } else first=first||m; }
  });
  if(first) (first.focus?first.focus():null), first.scrollIntoView({block:'center'});
  return ok;
}
nextBtn.addEventListener('click',()=>{ if(validate(state.cur)) show(state.cur+1); });
backBtn.addEventListener('click',()=>{ if(state.cur>-1) show(state.cur-1); });
document.getElementById('startBtn').addEventListener('click',()=>show(0));
document.getElementById('waLink').addEventListener('click',()=>{ document.getElementById('afterSend').hidden=false; });

document.getElementById('copyBtn').addEventListener('click',()=>{
  const msg=buildMessage(), note=document.getElementById('copyNote');
  const done=()=>{ note.hidden=false; note.textContent='تم النسخ. الصقها في محادثة الواتساب على الرقم 0566526253'; };
  try{ navigator.clipboard.writeText(msg).then(done).catch(selectPreview); }catch(e){ selectPreview(); }
  function selectPreview(){ const r=document.createRange(); r.selectNodeContents(document.getElementById('preview'));
    const s=getSelection(); s.removeAllRanges(); s.addRange(r); note.hidden=false; note.textContent='حددنا لك النص، اضغط "نسخ" من قائمة جوالك.'; }
});

show(Math.min(Math.max(state.cur ?? -1, -1),7));
</script>
